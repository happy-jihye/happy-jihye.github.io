          ko: "웹툰 캐릭터를 움직이게 하는 토킹 헤드 모델을 직접 개발해 LINE WEBTOON 2021 연말 결산 페이지에 적용했고, 제 아이디어에서 출발한 WebtoonMe의 첫 프로토타입을 만들었습니다. 이 성과로 졸업 전에 정규직 제안을 받았습니다."

