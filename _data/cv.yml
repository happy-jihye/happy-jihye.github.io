      ko: "SFT, 강화학습, 증류를 활용해 LLM을 Post-training하며, 에이전트형 소형 언어 모델(SLM)과 기계번역을 중점적으로 연구하고 있습니다. 모델 성능을 측정하는 평가 파이프라인과 벤치마크 인프라도 함께 구축하고 있습니다."

