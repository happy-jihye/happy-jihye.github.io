about:
  - en: "I'm an AI Research Engineer at Tether AI Research, working on small language models for on-device agents and multilingual machine translation. I work across the full model development cycle, from data construction and pre-, mid- and post-training to evaluation and model compression for deployment."
    ko: "Tether AI Research의 AI Research Engineer로, 온디바이스 에이전트와 다국어 기계번역을 위한 소형 언어 모델을 연구하고 있습니다. 데이터 구축부터 Pre-training, Mid-training, Post-training, 평가, 배포를 위한 경량화까지 모델 개발의 전 과정을 다룹니다."
  - en: "Previously, at NAVER Search, I trained Korean-specialized LLMs and built models for AI Briefing, generative retrieval and ranking. Before that, at NAVER WEBTOON, I worked on generative models and led WebtoonMe and AI Character Chat from research through to launch. My work has been published at ACL, EMNLP, CVPR and SIGGRAPH Asia."
    ko: "이전에는 네이버 검색에서 한국어 특화 LLM을 학습하고, AI 브리핑·생성형 검색·랭킹 모델을 개발했습니다. 그 전에는 NAVER WEBTOON에서 생성형 모델을 연구하며 WebtoonMe와 AI 캐릭터챗을 연구 단계부터 서비스 출시까지 이끌었습니다. 연구 성과는 ACL, EMNLP, CVPR, SIGGRAPH Asia에 발표했습니다."

