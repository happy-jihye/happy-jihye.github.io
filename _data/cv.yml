    url: "https://www.navercorp.com"
    logo: /assets/img/logos/naver.png
    roles:
      - title: "AI Research Engineer"
        period: { en: "Dec 2024 – Feb 2026", ko: "2024.12 – 2026.02" }
        location: { en: "Full-time", ko: "정규직" }
    summary:
      en: "I was responsible for LLM development for Search and Shopping end to end, from data curation and training to optimization, evaluation and deployment. I built Korean- and domain-specialized LLMs with continual pre-training, pruning and distillation, and optimized them for real-time serving with quantization. On the service side, I developed the real-time response model behind AI Briefing and AuthGR, an authority-aware generative retrieval model, and designed a unified evaluation framework with an automated leaderboard."
      ko: "검색·쇼핑 LLM 개발을 데이터 큐레이션부터 학습, 최적화, 평가, 배포까지 전담했습니다. Continual Pre-training과 Pruning·Distillation으로 한국어·도메인 특화 LLM을 만들고, 양자화로 실시간 서빙에 맞게 최적화했습니다. 서비스 측면에서는 AI 브리핑의 실시간 답변 생성 모델과 신뢰도 기반 생성형 검색 모델인 AuthGR을 개발했고, 표준 벤치마크와 서비스 품질 기준을 함께 보는 통합 평가 프레임워크와 자동 리더보드를 설계했습니다."

  - org: "NAVER WEBTOON"
    url: "https://www.webtoons.com"
    logo: /assets/img/logos/webtoon.png
    roles:
      - title: "AI Research Engineer (LLM)"
        period: { en: "Feb 2023 – Nov 2024", ko: "2023.02 – 2024.11" }
        summary:
          en: "With no dedicated LLM organization in the company, I proposed and led its first LLM project, AI Character Chat. I trained models to preserve each character's identity and story context and designed the agent system behind the chatbot, which launched successfully and became a revenue-generating product."
          ko: "사내에 전담 LLM 조직이 없던 시기에 회사의 첫 LLM 프로젝트인 AI 캐릭터챗을 제안하고 이끌었습니다. 캐릭터의 정체성과 작품 맥락을 유지하도록 모델을 학습하고 에이전트 시스템을 설계해 캐릭터 챗봇을 만들었으며, 성공적으로 출시되어 매출을 내는 서비스로 자리 잡았습니다."
      - title: "AI Research Engineer (Vision)"
        period: { en: "Feb 2022 – Feb 2023", ko: "2022.02 – 2023.02" }
        summary:
          en: "I led the research behind WebtoonMe, turning a research prototype into a real-time service that handled large-scale traffic, and published the underlying research at SIGGRAPH Asia and CVPR. I also built AI PhotoCard, which dresses characters in new outfits using fine-tuned diffusion models, and a pipeline that turns webtoons into short promotional videos."
          ko: "WebtoonMe의 연구를 주도하며 연구 프로토타입을 대규모 트래픽을 처리하는 실시간 서비스로 만들었고, 관련 연구를 SIGGRAPH Asia와 CVPR에 발표했습니다. 또한 Diffusion 모델을 파인튜닝해 캐릭터에 새 의상을 입히는 AI 포토카드와, 웹툰을 숏폼 홍보 영상으로 만드는 파이프라인을 개발했습니다."
      - title: "AI Research Engineer Intern"
